<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Cardio exercise demo">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes runLegF {
      0%,100% { transform: rotate(-30deg); }
      50%      { transform: rotate(40deg); }
    }
    @keyframes runLegB {
      0%,100% { transform: rotate(40deg); }
      50%      { transform: rotate(-30deg); }
    }
    @keyframes runArmF {
      0%,100% { transform: rotate(-35deg); }
      50%      { transform: rotate(30deg); }
    }
    @keyframes runArmB {
      0%,100% { transform: rotate(30deg); }
      50%      { transform: rotate(-35deg); }
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    .runner       { animation: bounce 0.55s ease-in-out infinite; }
    .leg-front    { animation: runLegF 0.55s ease-in-out infinite; transform-origin: 320px 238px; }
    .leg-back     { animation: runLegB 0.55s ease-in-out infinite; transform-origin: 320px 238px; }
    .arm-front    { animation: runArmF 0.55s ease-in-out infinite; transform-origin: 320px 196px; }
    .arm-back     { animation: runArmB 0.55s ease-in-out infinite; transform-origin: 320px 196px; }
  </style>

  <rect width="640" height="360" fill="url(#cg)" rx="20"/>

  <!-- Ground -->
  <rect x="60" y="294" width="520" height="14" rx="7" fill="#c8d8e8"/>

  <!-- Shadow -->
  <ellipse cx="320" cy="296" rx="38" ry="6" fill="#c8d8e8" opacity="0.6"/>

  <!-- Running figure -->
  <g class="runner">
    <!-- Head -->
    <circle cx="320" cy="148" r="26" fill="#1e293b"/>

    <!-- Torso (slightly leaned forward) -->
    <line x1="320" y1="174" x2="314" y2="240" stroke="#1e293b" stroke-width="16" stroke-linecap="round"/>

    <!-- Back arm -->
    <g class="arm-back">
      <line x1="320" y1="196" x2="284" y2="230" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
      <line x1="284" y1="230" x2="270" y2="212" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    </g>

    <!-- Front arm -->
    <g class="arm-front">
      <line x1="320" y1="196" x2="356" y2="228" stroke="#0f9f6e" stroke-width="12" stroke-linecap="round"/>
      <line x1="356" y1="228" x2="374" y2="210" stroke="#0f9f6e" stroke-width="12" stroke-linecap="round"/>
    </g>

    <!-- Back leg -->
    <g class="leg-back">
      <line x1="316" y1="238" x2="296" y2="280" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
      <line x1="296" y1="280" x2="274" y2="292" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
    </g>

    <!-- Front leg -->
    <g class="leg-front">
      <line x1="316" y1="238" x2="348" y2="278" stroke="#0f9f6e" stroke-width="14" stroke-linecap="round"/>
      <line x1="348" y1="278" x2="372" y2="288" stroke="#0f9f6e" stroke-width="14" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Label -->
  <text x="320" y="334" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#1e293b" letter-spacing="-0.3">Cardio Training</text>
</svg>
