<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Bodyweight exercise demo">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eafaf3"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes pushup {
      0%,100% { transform: translateY(0px) rotate(0deg); }
      45%      { transform: translateY(-44px) rotate(-8deg); }
    }
    @keyframes armBend {
      0%,100% { transform: rotate(0deg); }
      45%      { transform: rotate(-30deg); }
    }
    .pushup-body { animation: pushup 1.6s ease-in-out infinite; transform-origin: 200px 268px; }
    .pushup-arm-l { animation: armBend 1.6s ease-in-out infinite; transform-origin: 240px 248px; }
    .pushup-arm-r { animation: armBend 1.6s ease-in-out infinite; transform-origin: 388px 248px; }
  </style>

  <rect width="640" height="360" fill="url(#bg2)" rx="20"/>

  <!-- Floor -->
  <rect x="60" y="286" width="520" height="14" rx="7" fill="#c8d8e8"/>

  <!-- Static hands on floor -->
  <circle cx="200" cy="288" r="11" fill="#1e293b" opacity="0.5"/>
  <circle cx="450" cy="288" r="11" fill="#1e293b" opacity="0.5"/>

  <!-- Animated push-up body group -->
  <g class="pushup-body">
    <!-- Lower body / plank line (hips to feet) -->
    <line x1="200" y1="268" x2="490" y2="260" stroke="#1e293b" stroke-width="16" stroke-linecap="round"/>

    <!-- Feet -->
    <circle cx="488" cy="258" r="14" fill="#1e293b"/>

    <!-- Upper torso to head -->
    <line x1="200" y1="268" x2="172" y2="240" stroke="#1e293b" stroke-width="16" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="158" cy="224" r="24" fill="#1e293b"/>

    <!-- Left arm -->
    <g class="pushup-arm-l">
      <line x1="240" y1="265" x2="202" y2="286" stroke="#0f9f6e" stroke-width="13" stroke-linecap="round"/>
    </g>

    <!-- Right arm -->
    <g class="pushup-arm-r">
      <line x1="388" y1="262" x2="450" y2="286" stroke="#0f9f6e" stroke-width="13" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Label -->
  <text x="320" y="334" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#1e293b" letter-spacing="-0.3">Bodyweight Training</text>
</svg>
