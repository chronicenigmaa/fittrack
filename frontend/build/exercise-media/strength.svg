<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Strength exercise demo">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fff8"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes press {
      0%   { transform: translateY(0px); }
      45%  { transform: translateY(-56px); }
      100% { transform: translateY(0px); }
    }
    .barbell { animation: press 1.8s ease-in-out infinite; transform-origin: 320px 150px; }
  </style>

  <rect width="640" height="360" fill="url(#sg)" rx="20"/>

  <!-- Floor -->
  <rect x="60" y="286" width="520" height="14" rx="7" fill="#c8d8e8"/>

  <!-- Bench legs -->
  <rect x="188" y="230" width="14" height="58" rx="5" fill="#3a4a5a" opacity="0.5"/>
  <rect x="436" y="230" width="14" height="58" rx="5" fill="#3a4a5a" opacity="0.5"/>

  <!-- Bench pad -->
  <rect x="168" y="212" width="300" height="22" rx="11" fill="#2563eb" opacity="0.55"/>

  <!-- Person: legs -->
  <path d="M205 222 L148 262 L128 290" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M218 222 L162 268 L144 290" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Person: torso -->
  <rect x="208" y="200" width="248" height="18" rx="9" fill="#1e293b"/>

  <!-- Person: head -->
  <circle cx="476" cy="198" r="22" fill="#1e293b"/>

  <!-- Animated barbell + arms group -->
  <g class="barbell">
    <!-- Arms from chest to bar -->
    <line x1="264" y1="208" x2="248" y2="152" stroke="#1e293b" stroke-width="11" stroke-linecap="round"/>
    <line x1="388" y1="208" x2="404" y2="152" stroke="#1e293b" stroke-width="11" stroke-linecap="round"/>

    <!-- Bar -->
    <rect x="114" y="143" width="410" height="14" rx="7" fill="#0f172a"/>

    <!-- Left outer plate -->
    <rect x="96" y="116" width="30" height="68" rx="7" fill="#0f9f6e"/>
    <rect x="100" y="122" width="18" height="56" rx="5" fill="#11b87e"/>

    <!-- Left inner plate -->
    <rect x="126" y="122" width="16" height="56" rx="5" fill="#0b7f59"/>

    <!-- Right inner plate -->
    <rect x="496" y="122" width="16" height="56" rx="5" fill="#0b7f59"/>

    <!-- Right outer plate -->
    <rect x="512" y="116" width="30" height="68" rx="7" fill="#0f9f6e"/>
    <rect x="516" y="122" width="18" height="56" rx="5" fill="#11b87e"/>

    <!-- Collar bolts -->
    <circle cx="140" cy="150" r="5" fill="#172033"/>
    <circle cx="498" cy="150" r="5" fill="#172033"/>
  </g>

  <!-- Label -->
  <text x="320" y="334" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#1e293b" letter-spacing="-0.3">Strength Training</text>
</svg>
