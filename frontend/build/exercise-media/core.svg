<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Core exercise demo">
  <defs>
    <linearGradient id="corebg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes crunch {
      0%,100% { transform: rotate(0deg); }
      40%      { transform: rotate(-48deg); }
    }
    .torso-group { animation: crunch 1.7s ease-in-out infinite; transform-origin: 310px 256px; }
  </style>

  <rect width="640" height="360" fill="url(#corebg)" rx="20"/>

  <!-- Floor mat -->
  <rect x="80" y="268" width="480" height="18" rx="9" fill="#c8d8e8"/>
  <rect x="88" y="272" width="464" height="10" rx="5" fill="#b8ccd8" opacity="0.5"/>

  <!-- Lower body (static) — legs flat on floor -->
  <line x1="310" y1="258" x2="500" y2="252" stroke="#1e293b" stroke-width="16" stroke-linecap="round"/>
  <!-- Knees bent up slightly -->
  <line x1="500" y1="252" x2="520" y2="230" stroke="#1e293b" stroke-width="16" stroke-linecap="round"/>
  <line x1="520" y1="230" x2="540" y2="258" stroke="#1e293b" stroke-width="16" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="546" cy="262" rx="16" ry="9" fill="#1e293b"/>

  <!-- Animated torso + head group -->
  <g class="torso-group">
    <!-- Torso -->
    <line x1="310" y1="256" x2="218" y2="220" stroke="#1e293b" stroke-width="18" stroke-linecap="round"/>

    <!-- Shoulders & arms (reaching toward knees) -->
    <line x1="220" y1="226" x2="250" y2="244" stroke="#d97706" stroke-width="12" stroke-linecap="round"/>
    <line x1="220" y1="226" x2="248" y2="252" stroke="#d97706" stroke-width="12" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="200" cy="206" r="26" fill="#1e293b"/>
  </g>

  <!-- Label -->
  <text x="320" y="334" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#1e293b" letter-spacing="-0.3">Core Training</text>
</svg>
